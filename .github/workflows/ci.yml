name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript · lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: packages/widget imports @ferryline/core and @ferryline/sdk as package
      # dependencies, and the type-aware eslint rules below can only resolve those imports once
      # each package's dist/*.d.ts exists. Linting before building left widget's imports
      # unresolved on a clean checkout, tripping @typescript-eslint/no-unsafe-* everywhere.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test

  contracts:
    name: Soroban · cargo test, contract build
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: 26.1.0
    defaults:
      run:
        working-directory: contracts/router
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/router
      - name: Install stellar-cli
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          install -m 0755 stellar /usr/local/bin/stellar
          stellar --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: stellar contract build
